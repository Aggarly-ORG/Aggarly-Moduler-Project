<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Price Drop Alert — Aggarly</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 24px; }
        .card { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .header { text-align: center; margin-bottom: 24px; }
        .brand { font-size: 24px; font-weight: 700; color: #10b981; }
        .title { font-size: 20px; font-weight: 600; margin-top: 12px; }
        .details { background: #ecfdf5; border-radius: 8px; padding: 16px; margin: 20px 0; border: 1px solid #a7f3d0; text-align: center; }
        .price { font-size: 28px; font-weight: 700; color: #059669; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="brand">Aggarly AI Watchdog</div>
        <div class="title">Price Drop Detected! 📉</div>
    </div>
    <p>Hi <span th:text="${recipientName}">Traveler</span>,</p>
    <p>A property you are watching has dropped in price!</p>

    <div class="details">
        <div class="price" th:text="${newPrice}">$95 / night</div>
        <p><strong th:text="${propertyTitle}">Beachfront Studio</strong></p>
    </div>

    <div class="footer">
        Aggarly AI Price Monitoring
    </div>
</div>
</body>
</html>
