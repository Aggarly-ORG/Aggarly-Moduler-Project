<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cleaning Alert — Aggarly</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 24px; }
        .card { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .header { text-align: center; margin-bottom: 24px; }
        .brand { font-size: 24px; font-weight: 700; color: #0284c7; }
        .title { font-size: 20px; font-weight: 600; margin-top: 12px; }
        .details { background: #f1f5f9; border-radius: 8px; padding: 16px; margin: 20px 0; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="brand">Aggarly Operations</div>
        <div class="title">Cleaning Turnover Update 🧹</div>
    </div>
    <p>Hi <span th:text="${recipientName}">Host</span>,</p>
    <p><strong th:text="${title}">Turnover Completed</strong></p>
    <div class="details">
        <p th:text="${message}">Your property has been cleaned and inspected.</p>
    </div>
    <div class="footer">
        Aggarly Operations Engine
    </div>
</div>
</body>
</html>
