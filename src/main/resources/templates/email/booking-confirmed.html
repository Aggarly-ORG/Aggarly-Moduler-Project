<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed — Aggarly</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 24px; }
        .card { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .header { text-align: center; margin-bottom: 24px; }
        .brand { font-size: 24px; font-weight: 700; color: #2563eb; }
        .title { font-size: 20px; font-weight: 600; margin-top: 12px; }
        .details { background: #f1f5f9; border-radius: 8px; padding: 16px; margin: 20px 0; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .label { color: #64748b; }
        .value { font-weight: 600; }
        .btn { display: inline-block; background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; text-align: center; margin-top: 16px; }
        .footer { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="brand">Aggarly</div>
        <div class="title">Your Reservation is Confirmed! 🎉</div>
    </div>
    <p>Hi <span th:text="${recipientName}">Guest</span>,</p>
    <p>Great news! Your booking for <strong th:text="${propertyTitle}">Luxury Apartment</strong> has been confirmed.</p>

    <div class="details">
        <div class="row">
            <span class="label">Booking Reference:</span>
            <span class="value" th:text="${bookingId}">#12345</span>
        </div>
        <div class="row">
            <span class="label">Check-in:</span>
            <span class="value" th:text="${checkIn}">2026-09-01</span>
        </div>
        <div class="row">
            <span class="label">Check-out:</span>
            <span class="value" th:text="${checkOut}">2026-09-05</span>
        </div>
        <div class="row">
            <span class="label">Total Paid:</span>
            <span class="value" th:text="${totalAmount}">$480.00</span>
        </div>
    </div>

    <div style="text-align: center;">
        <a th:href="${actionUrl}" class="btn" style="color: #ffffff;">View Reservation Details</a>
    </div>

    <div class="footer">
        Thank you for choosing Aggarly. Safe travels!
    </div>
</div>
</body>
</html>
