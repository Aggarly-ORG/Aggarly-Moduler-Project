# ===================================================================
# Aggarly — Test Profile (Testcontainers)
# ===================================================================
# Testcontainers will automatically spin up PostgreSQL and Redis
# containers during integration tests. No manual Docker setup needed.
# ===================================================================

spring:
  # ========================
  # DataSource — Testcontainers manages this
  # ========================
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///aggarly_test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  # ========================
  # JPA
  # ========================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # ========================
  # Redis — disabled in tests by default
  # (enable per-test with @Testcontainers if needed)
  # ========================
  data:
    redis:
      host: localhost
      port: 6379

  # ========================
  # Flyway
  # ========================
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true

  # ========================
  # Mail — disabled in tests
  # ========================
  mail:
    host: localhost
    port: 1025

  # ========================
  # Docker Compose — disabled in tests
  # ========================
  docker:
    compose:
      enabled: false

# ===================================================================
# App — test overrides
# ===================================================================
app:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-must-be-256-bits-long-minimum
    access-token-expiration-ms: 60000       # 1 minute (faster tests)
    refresh-token-expiration-ms: 300000     # 5 minutes

  minio:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket-name: test-bucket

  stripe:
    secret-key: sk_test_fake
    webhook-secret: whsec_test_fake

# ===================================================================
# Logging — quiet in tests
# ===================================================================
logging:
  level:
    root: WARN
    com.luna.aggarly: INFO
    org.testcontainers: INFO
    org.flywaydb: INFO
