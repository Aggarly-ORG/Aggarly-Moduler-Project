# ===================================================================
# Aggarly — Property Rental Platform
# Docker Compose for local development
# ===================================================================
# Usage:
#   docker compose up -d          (start all services)
#   docker compose down           (stop all services)
#   docker compose down -v        (stop + remove volumes)
# ===================================================================

services:

  # ========================
  # PostgreSQL 16
  # ========================
  postgres:
    image: 'postgres:16-alpine'
    container_name: aggarly-postgres
    environment:
      POSTGRES_DB: aggarly_db
      POSTGRES_USER: aggarly
      POSTGRES_PASSWORD: aggarly_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aggarly -d aggarly_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================
  # Redis 7
  # ========================
  redis:
    image: 'redis:7-alpine'
    container_name: aggarly-redis
    command: redis-server --requirepass aggarly_redis_secret --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "aggarly_redis_secret", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================
  # MinIO (S3-compatible storage)
  # ========================
  minio:
    image: 'minio/minio:latest'
    container_name: aggarly-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aggarly_minio
      MINIO_ROOT_PASSWORD: aggarly_minio_secret
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO Console (Web UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================
  # Qdrant Vector Database
  # ========================
  qdrant:
    image: 'qdrant/qdrant:latest'
    container_name: aggarly-qdrant
    ports:
      - '6333:6333'   # HTTP API & Web UI
      - '6334:6334'   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================
  # Mailhog (Email testing)
  # ========================
  mailhog:
    image: 'mailhog/mailhog:latest'
    container_name: aggarly-mailhog
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI (view caught emails)
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local
